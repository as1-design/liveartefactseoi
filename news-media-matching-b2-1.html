<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Leo · Media Verification · B2.1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #070e1d;
    --panel: #0d1830;
    --panel-2: #122242;
    --line: #1f3358;
    --text: #e3ebf7;
    --muted: #8ea3c4;
    --cyan: #38bdf8;
    --cyan-tint: rgb(56 189 248 / .16);
    --alert: #f43f5e;
    --amber: #fbbf24;
    --ok: #34d399;
    --state: var(--alert);
    --mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
    --sans: 'IBM Plex Sans', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;
    color-scheme: dark;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  /* The console is dark by design; light-mode viewers get the same palette. */
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #070e1d; } }
  :root[data-theme="dark"] { --bg: #070e1d; }
  body.secure { --state: var(--ok); }

  *, *::before, *::after { box-sizing: border-box; }
  html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0; height: 100%;
    color: var(--text); font-family: var(--sans);
    background-color: var(--bg);
    background-image:
      radial-gradient(ellipse 70% 55% at 50% -10%, color-mix(in srgb, var(--state) 22%, transparent), transparent 70%),
      linear-gradient(rgb(56 189 248 / .07) 1px, transparent 1px),
      linear-gradient(90deg, rgb(56 189 248 / .07) 1px, transparent 1px);
    background-size: 100% 100%, 28px 28px, 28px 28px;
    transition: background-image .8s;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; }

  .stage {
    max-width: 1060px; margin: 0 auto; min-height: 100%;
    display: flex; flex-direction: column;
    padding: clamp(8px, 2vh, 18px) clamp(12px, 2.5vw, 26px) 6px;
    gap: clamp(7px, 1.4vh, 12px);
  }
  @media (min-width: 700px) { .stage { height: 100%; } }

  /* Header */
  .top {
    position: relative; overflow: hidden;
    display: flex; align-items: center; gap: 14px;
    padding: 8px 14px; border-radius: 10px;
    background: var(--panel); border: 1px solid var(--line);
    border-left: 5px solid var(--state);
    transition: border-color .6s;
  }
  .top::after { /* scan line */
    content: ""; position: absolute; top: 0; bottom: 0; width: 120px; left: -140px;
    background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--state) 30%, transparent), transparent);
    animation: scan 5s linear infinite;
    pointer-events: none;
  }
  @keyframes scan { to { left: 110%; } }
  .eye { flex: none; width: 46px; height: 46px; }
  .eye .ring { fill: none; stroke: var(--state); stroke-width: 2; opacity: .9; transition: stroke .6s; }
  .eye .iris { fill: color-mix(in srgb, var(--state) 35%, #000); stroke: var(--state); stroke-width: 1.5; transition: fill .6s, stroke .6s; }
  .eye .pupil-g { transition: transform .25s ease-out; }
  .eye .pupil { fill: var(--state); transition: fill .6s; }
  .eye .glint { fill: #fff; opacity: .85; }
  .eye .halo { fill: none; stroke: var(--state); stroke-width: 1; transform-origin: 23px 23px; animation: halo 2.4s ease-out infinite; }
  body.secure .eye .halo { animation-duration: 5s; }
  @keyframes halo { from { transform: scale(.7); opacity: .8; } to { transform: scale(1.1); opacity: 0; } }

  .title { flex: 1; min-width: 0; }
  .title .sys { font-family: var(--mono); font-size: .7rem; color: var(--muted); letter-spacing: .06em; }
  .title h1 { margin: 1px 0 0; font-size: clamp(1.05rem, 2.4vw, 1.45rem); font-weight: 700; letter-spacing: -0.01em; }
  .status {
    flex: none; font-family: var(--mono); font-size: .74rem; font-weight: 600;
    padding: 6px 11px; border-radius: 6px;
    color: var(--state); border: 1px solid var(--state);
    background: color-mix(in srgb, var(--state) 12%, transparent);
    display: inline-flex; align-items: center; gap: 8px;
    transition: color .6s, border-color .6s, background .6s;
  }
  .status .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--state); animation: blink 1.1s steps(2, start) infinite; }
  body.secure .status .dot { animation: none; }
  @keyframes blink { to { visibility: hidden; } }

  /* Sector tabs */
  .rounds { display: flex; gap: 6px; }
  .round-tab {
    flex: 1; cursor: pointer; text-align: left;
    padding: 7px 12px; border-radius: 8px;
    background: var(--panel); border: 1px solid var(--line);
    display: flex; align-items: baseline; gap: 8px;
    transition: border-color .2s, background .2s, transform .15s;
  }
  .round-tab:hover { transform: translateY(-2px); border-color: var(--cyan); }
  .round-tab:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
  .round-tab .code { font-family: var(--mono); font-size: .7rem; color: var(--muted); }
  .round-tab .name { font-size: clamp(.78rem, 1.4vw, .9rem); font-weight: 600; }
  .round-tab .st { margin-left: auto; font-family: var(--mono); font-size: .66rem; color: var(--alert); }
  .round-tab[aria-selected="true"] { background: var(--panel-2); border-color: var(--cyan); box-shadow: inset 0 -3px 0 var(--cyan); }
  .round-tab.done .st { color: var(--ok); }

  /* Board = camera feed */
  .board {
    position: relative; flex: 1; min-height: 0;
    background: color-mix(in srgb, var(--panel) 92%, transparent);
    border: 1px solid var(--line); border-radius: 12px;
    padding: clamp(10px, 2vh, 18px) clamp(14px, 2vw, 22px);
    display: flex; flex-direction: column; gap: clamp(7px, 1.3vh, 11px);
    box-shadow: 0 0 0 1px rgb(0 0 0 / .4), 0 0 38px -12px color-mix(in srgb, var(--state) 55%, transparent);
    transition: box-shadow .8s;
  }
  .corner { position: absolute; width: 18px; height: 18px; border: 3px solid var(--cyan); pointer-events: none; }
  .corner.tl { top: -2px; left: -2px; border-right: 0; border-bottom: 0; border-top-left-radius: 10px; }
  .corner.tr { top: -2px; right: -2px; border-left: 0; border-bottom: 0; border-top-right-radius: 10px; }
  .corner.bl { bottom: -2px; left: -2px; border-right: 0; border-top: 0; border-bottom-left-radius: 10px; }
  .corner.br { bottom: -2px; right: -2px; border-left: 0; border-top: 0; border-bottom-right-radius: 10px; }
  .feed-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .instruction { margin: 0; font-size: clamp(.82rem, 1.5vw, .95rem); color: var(--muted); }
  .instruction strong { color: var(--text); font-weight: 600; }
  .live { flex: none; font-family: var(--mono); font-size: .68rem; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .live::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--alert); animation: blink 1.4s steps(2, start) infinite; }

  .columns { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, .9fr) minmax(0, 2.1fr); gap: clamp(8px, 1.6vw, 18px); }
  .col { display: flex; flex-direction: column; gap: clamp(4px, .75vh, 7px); min-height: 0; }

  .item {
    position: relative; flex: 1 1 0; min-height: 34px; max-height: 62px;
    display: flex; align-items: center; gap: 10px;
    text-align: left; cursor: pointer;
    padding: 5px 12px; border-radius: 7px;
    background: var(--panel-2); border: 1.5px solid var(--line);
    font-size: clamp(.78rem, 1.45vw, .92rem); line-height: 1.3;
    transition: border-color .15s, background .15s, transform .12s;
  }
  @media (min-width: 700px) { .item { min-height: 26px; } }
  .item:hover:not(.matched) { border-color: var(--cyan); transform: translateY(-1px); }
  .item:active:not(.matched) { transform: scale(.97); }
  .item:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
  .item.term { font-weight: 600; font-size: clamp(.88rem, 1.65vw, 1.04rem); }
  .item.selected { border-color: var(--cyan); background: var(--cyan-tint); box-shadow: 0 0 14px -4px var(--cyan); }
  .item.matched {
    cursor: default; border-color: var(--pair);
    background: color-mix(in srgb, var(--pair) 14%, var(--panel-2));
  }
  .item.wrong { border-color: var(--amber); background: rgb(251 191 36 / .14); animation: shake .36s; }
  @keyframes shake { 20% { transform: translateX(-4px); } 40% { transform: translateX(4px); } 60% { transform: translateX(-3px); } 80% { transform: translateX(3px); } }
  .badge {
    flex: none; width: 21px; height: 21px; border-radius: 4px;
    display: grid; place-items: center;
    font-family: var(--mono); font-size: .7rem; font-weight: 700; color: #04101f;
    background: var(--pair); transform: scale(0); transition: transform .3s cubic-bezier(.34,1.56,.64,1);
  }
  .item:not(.matched) .badge { width: 0; margin-right: -10px; }
  .item.matched .badge { transform: scale(1); }

  /* Bottom bar */
  .bar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .log { flex: 1; min-width: 180px; font-family: var(--mono); font-size: .76rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .log .prompt { color: var(--cyan); }
  .log.warn { color: var(--amber); }
  .log.good { color: var(--ok); }
  .log .caret { display: inline-block; width: 7px; height: 12px; background: currentColor; vertical-align: -1px; margin-left: 3px; animation: blink 1s steps(2, start) infinite; }
  .progress { display: flex; align-items: center; gap: 8px; font-family: var(--mono); font-size: .74rem; color: var(--muted); }
  .track { width: clamp(70px, 14vw, 150px); height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
  .fill { height: 100%; width: 0; background: var(--cyan); transition: width .4s ease; }
  .btn {
    cursor: pointer; font-family: var(--mono); font-size: .76rem; font-weight: 600;
    padding: 7px 13px; border-radius: 6px;
    background: transparent; border: 1px solid var(--line); color: var(--muted);
    transition: border-color .15s, color .15s, transform .12s;
  }
  .btn:hover { color: var(--text); border-color: var(--cyan); transform: translateY(-1px); }
  .btn:active { transform: scale(.96); }
  .btn:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
  .btn.primary { background: var(--cyan); border-color: var(--cyan); color: #04101f; }
  .btn.primary:hover { color: #04101f; background: #7dd3fc; }
  .btn[hidden] { display: none; }

  .credit { text-align: center; font-size: .7rem; color: var(--muted); padding: 1px 0 3px; }

  /* Sweep on completion */
  .sweep {
    position: fixed; inset: 0; z-index: 8; pointer-events: none;
    background: linear-gradient(90deg, transparent 0%, rgb(52 211 153 / .0) 30%, rgb(52 211 153 / .45) 48%, rgb(52 211 153 / .9) 50%, rgb(52 211 153 / .45) 52%, transparent 70%);
    background-size: 300% 100%; background-position: 100% 0; opacity: 0;
  }
  .sweep.go { animation: sweep 1.1s ease-in-out forwards; }
  @keyframes sweep { 0% { opacity: 1; background-position: 100% 0; } 90% { opacity: 1; } 100% { opacity: 0; background-position: 0% 0; } }

  /* Toast */
  .toast {
    position: fixed; left: 50%; top: calc(14px + env(safe-area-inset-top, 0px)); z-index: 6;
    transform: translate(-50%, -20px); opacity: 0; pointer-events: none;
    font-family: var(--mono); font-size: .8rem; font-weight: 600;
    padding: 8px 16px; border-radius: 6px;
    background: var(--panel); color: var(--ok); border: 1px solid var(--ok);
    box-shadow: 0 0 22px -6px var(--ok);
    transition: opacity .3s, transform .3s;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  /* Modals */
  .overlay {
    position: fixed; inset: 0; z-index: 10; padding: 16px;
    background: rgb(2 6 16 / .72); display: grid; place-items: center;
    opacity: 0; pointer-events: none; transition: opacity .25s;
  }
  .overlay.open { opacity: 1; pointer-events: auto; }
  .modal {
    position: relative; width: min(480px, 100%);
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    border-top: 5px solid var(--mcol, var(--alert));
    box-shadow: 0 0 60px -14px var(--mcol, var(--alert)), 0 25px 50px -12px rgb(0 0 0 / .6);
    padding: clamp(16px, 3.2vh, 26px) clamp(18px, 3vw, 28px);
    transform: translateY(12px) scale(.97); transition: transform .3s cubic-bezier(.34,1.56,.64,1);
  }
  .overlay.open .modal { transform: none; }
  .modal .sys { font-family: var(--mono); font-size: .7rem; color: var(--mcol, var(--alert)); letter-spacing: .06em; margin-bottom: 6px; }
  .modal h2 { margin: 0 0 12px; font-size: 1.35rem; font-weight: 700; }
  .modal p { margin: 0 0 18px; line-height: 1.6; font-size: .97rem; }
  .modal .actions { text-align: center; }
  .modal .btn { font-size: .9rem; padding: 9px 28px; }
  .win { --mcol: var(--ok); }
  .lines { font-family: var(--mono); font-size: .9rem; line-height: 1.75; margin: 0 0 14px; min-height: 7em; }
  .lines .ln::before { content: "> "; color: var(--ok); }
  .code-row { display: flex; align-items: center; justify-content: center; gap: 18px; margin-bottom: 12px; opacity: 0; transform: scale(.85); transition: opacity .3s, transform .4s cubic-bezier(.34,1.56,.64,1); }
  .code-row.in { opacity: 1; transform: none; }
  .code-label { font-family: var(--mono); font-size: .8rem; color: var(--muted); text-align: right; line-height: 1.4; }
  .code-digit {
    font-family: var(--mono); font-size: 3.2rem; font-weight: 700; line-height: 1;
    color: var(--ok); padding: 8px 22px; border-radius: 8px;
    border: 2px solid var(--ok); background: rgb(52 211 153 / .1);
    text-shadow: 0 0 18px rgb(52 211 153 / .7); min-width: 2.2ch; text-align: center;
  }
  .score-note { font-family: var(--mono); font-size: .74rem; color: var(--muted); text-align: center; margin: 0 0 14px; }

  @media (max-width: 560px) {
    .columns { grid-template-columns: minmax(0, .8fr) minmax(0, 2fr); }
    .item { padding: 5px 8px; gap: 6px; }
    .round-tab .name { display: none; }
    .round-tab .code { font-size: .78rem; color: var(--text); }
    .eye { width: 36px; height: 36px; }
    .title .sys, .live { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<div class="stage">
  <header class="top">
    <svg class="eye" viewBox="0 0 46 46" aria-hidden="true">
      <circle class="halo" cx="23" cy="23" r="20"/>
      <circle class="ring" cx="23" cy="23" r="21"/>
      <circle class="iris" cx="23" cy="23" r="14"/>
      <g class="pupil-g" id="pupil"><circle class="pupil" cx="23" cy="23" r="6"/><circle class="glint" cx="20.5" cy="20.5" r="1.8"/></g>
    </svg>
    <div class="title">
      <div class="sys">LEO // SCHOOL AI ASSISTANT</div>
      <h1>Media verification protocol</h1>
    </div>
    <div class="status" role="status"><span class="dot"></span><span id="statusText">Lockdown: media channels sealed</span></div>
  </header>

  <nav class="rounds" role="tablist" aria-label="Sectors" id="tabs"></nav>

  <section class="board">
    <span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span>
    <div class="feed-head">
      <p class="instruction" id="instruction"></p>
      <span class="live" id="cam">CAM 01 · LIVE</span>
    </div>
    <div class="columns">
      <div class="col" id="colTerms"></div>
      <div class="col" id="colDefs"></div>
    </div>
    <div class="bar">
      <div class="log" id="log" aria-live="polite"></div>
      <div class="progress"><span id="progressText">0/0</span><div class="track"><div class="fill" id="fill"></div></div></div>
      <button class="btn" id="resetBtn">Reset sector</button>
      <button class="btn primary" id="nextBtn" hidden>Next sector</button>
    </div>
  </section>

  <div class="credit">Class of Coffee – with AI assistance</div>
</div>

<div class="sweep" id="sweep"></div>
<div class="toast" id="toast"></div>

<div class="overlay open" id="taskOverlay" role="dialog" aria-modal="true" aria-labelledby="taskTitle">
  <div class="modal">
    <div class="sys">LEO // PRIORITY ALERT</div>
    <h2 id="taskTitle">Security notice</h2>
    <p id="taskText"></p>
    <div class="actions"><button class="btn primary" id="taskOk">OK</button></div>
  </div>
</div>

<div class="overlay" id="winOverlay" role="dialog" aria-modal="true" aria-labelledby="winTitle">
  <div class="modal win">
    <div class="sys">LEO // STATUS UPDATE</div>
    <h2 id="winTitle">Threat level lowered</h2>
    <div class="lines" id="winLines"></div>
    <div class="code-row" id="codeRow"><div class="code-label">New code<br>piece</div><div class="code-digit" id="codeDigit">?</div></div>
    <p class="score-note" id="scoreNote"></p>
    <div class="actions"><button class="btn primary" id="winOk">OK</button></div>
  </div>
</div>

<script>
/* ===== Edit these for the breakout ===== */
const CONFIG = {
  taskText: "Unverified media detected. To protect all occupants, information channels have been sealed. Please assist in pairing each item with its correct label. When classification is restored, a new part of the code will be shared.",
  successLines: [
    "Match confirmed.",
    "Media vocabulary correctly identified.",
    "Information sources verified.",
    "Thank you.",
    "Logic circuits recalibrated."
  ],
  codePiece: "0"
};
/* ====================================== */

const ROUNDS = [
  { name: "Headline verbs",
    instruction: "<strong>Headline verbs.</strong> Match each verb to its meaning in newspaper headlines.",
    pairs: [
      ["back", "support a person, plan or idea"],
      ["axe", "cut or cancel jobs or services"],
      ["vow", "promise firmly to do something"],
      ["quiz", "ask someone questions formally, e.g. the police or MPs"],
      ["clash", "disagree or argue strongly in public"]
    ]},
  { name: "Media professionals",
    instruction: "<strong>Media professionals.</strong> Match each person to what they do.",
    pairs: [
      ["critic", "reviews films, books or shows and judges their quality"],
      ["newsreader", "reads the news aloud on television or radio"],
      ["paparazzi", "photographers who follow famous people to get pictures"],
      ["commentator", "analyses events and gives an informed opinion on them"],
      ["reporter", "gathers information about events and reports the story"],
      ["agony aunt", "answers readers' letters about personal problems"],
      ["editor", "decides what is published and checks it first"],
      ["presenter", "introduces and hosts a TV or radio programme"],
      ["freelance journalist", "writes for different publications without being on the staff of one"]
    ]},
  { name: "Media ethics",
    instruction: "<strong>Media ethics.</strong> Match each adjective to its definition.",
    pairs: [
      ["biased", "unfairly favouring one side or opinion"],
      ["accurate", "correct in every detail"],
      ["sensational", "exaggerated to shock or excite the audience"],
      ["objective", "based on facts rather than personal feelings"],
      ["viral", "shared very quickly by huge numbers of people online"],
      ["trustworthy", "honest, so people can believe what it says"],
      ["censored", "with parts removed or blocked by the authorities"],
      ["reliable", "consistently good or correct over time"],
      ["misleading", "giving the wrong idea, even if not actually false"]
    ]}
];

const PAIR_COLOURS = ["#38bdf8","#a78bfa","#34d399","#fbbf24","#f472b6","#2dd4bf","#818cf8","#fb923c","#a3e635"];
const LETTERS = "ABCDEFGHI";
const TOTAL = ROUNDS.reduce((n, r) => n + r.pairs.length, 0);
const fresh = () => ({ matched: [], firstTry: 0, missed: new Set(), order: null, termOrder: null });
const state = ROUNDS.map(fresh);
let current = 0, selTerm = null, selDef = null, busy = false;

const $ = id => document.getElementById(id);
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const isDone = i => state[i].matched.length === ROUNDS[i].pairs.length;
const reduced = () => window.matchMedia("(prefers-reduced-motion: reduce)").matches;

function log(msg, tone) {
  const el = $("log");
  el.className = "log" + (tone ? " " + tone : "");
  el.innerHTML = `<span class="prompt">&gt;</span> <span class="msg"></span><span class="caret"></span>`;
  el.querySelector(".msg").textContent = msg;
}

function buildTabs() {
  ROUNDS.forEach((r, i) => {
    const b = document.createElement("button");
    b.className = "round-tab"; b.setAttribute("role", "tab");
    b.innerHTML = `<span class="code">S-0${i + 1}</span><span class="name">${r.name}</span><span class="st">LOCKED</span>`;
    b.addEventListener("click", () => { if (!busy) showRound(i); });
    $("tabs").appendChild(b);
  });
}
function refreshTabs() {
  [...$("tabs").children].forEach((b, i) => {
    b.setAttribute("aria-selected", i === current);
    b.classList.toggle("done", isDone(i));
    b.querySelector(".st").textContent = isDone(i) ? "SECURED" : "LOCKED";
  });
}

function showRound(i) {
  current = i; selTerm = selDef = null;
  const r = ROUNDS[i], s = state[i];
  if (!s.order) { s.order = shuffle(r.pairs.map((_, k) => k)); s.termOrder = shuffle(r.pairs.map((_, k) => k)); }
  $("instruction").innerHTML = r.instruction;
  $("cam").textContent = `CAM 0${i + 1} · LIVE`;
  const ct = $("colTerms"), cd = $("colDefs");
  ct.innerHTML = cd.innerHTML = "";
  s.termOrder.forEach(k => ct.appendChild(makeItem("term", k, r.pairs[k][0])));
  s.order.forEach(k => cd.appendChild(makeItem("def", k, r.pairs[k][1])));
  s.matched.forEach((k, n) => markMatched(k, n));
  refreshTabs(); updateProgress();
  log(isDone(i) ? `Sector ${i + 1} secured.` : `Sector ${i + 1}: awaiting classification…`, isDone(i) ? "good" : "");
}

function makeItem(kind, k, text) {
  const b = document.createElement("button");
  b.className = `item ${kind}`; b.dataset.k = k; b.dataset.kind = kind;
  b.innerHTML = `<span class="badge"></span><span class="txt"></span>`;
  b.querySelector(".txt").textContent = text;
  b.addEventListener("click", () => pick(b));
  return b;
}

function pick(el) {
  if (busy || el.classList.contains("matched")) return;
  lookAt(el);
  const isTerm = el.dataset.kind === "term";
  const prev = isTerm ? selTerm : selDef;
  if (prev) prev.classList.remove("selected");
  if (prev === el) { isTerm ? selTerm = null : selDef = null; return; }
  el.classList.add("selected");
  isTerm ? selTerm = el : selDef = el;
  if (selTerm && selDef) check();
}

function check() {
  const s = state[current], k = +selTerm.dataset.k;
  if (k === +selDef.dataset.k) {
    s.matched.push(k);
    if (!s.missed.has(k)) s.firstTry++;
    markMatched(k, s.matched.length - 1);
    log(`Pair ${LETTERS[s.matched.length - 1]} verified.`, "good");
    selTerm = selDef = null;
    updateProgress(); refreshTabs(); calmEye();
    if (isDone(current)) roundDone();
  } else {
    s.missed.add(k); s.missed.add(+selDef.dataset.k);
    busy = true;
    const a = selTerm, b = selDef;
    [a, b].forEach(x => { x.classList.remove("selected"); x.classList.add("wrong"); });
    selTerm = selDef = null;
    log("Mismatch logged. Try again.", "warn");
    setTimeout(() => { a.classList.remove("wrong"); b.classList.remove("wrong"); busy = false; }, 500);
  }
}

function markMatched(k, n) {
  const colour = PAIR_COLOURS[n % PAIR_COLOURS.length];
  document.querySelectorAll(`.item[data-k="${k}"]`).forEach(el => {
    el.classList.remove("selected"); el.classList.add("matched");
    el.style.setProperty("--pair", colour);
    el.querySelector(".badge").textContent = LETTERS[n];
    el.setAttribute("aria-disabled", "true");
    el.setAttribute("aria-label", `${el.querySelector(".txt").textContent}, matched, pair ${LETTERS[n]}`);
  });
}

function updateProgress() {
  const done = state[current].matched.length, n = ROUNDS[current].pairs.length;
  $("progressText").textContent = `${done}/${n}`;
  $("fill").style.width = (done / n * 100) + "%";
  const next = ROUNDS.findIndex((_, i) => !isDone(i));
  $("nextBtn").hidden = !(done === n && next !== -1);
}

function roundDone() {
  if (ROUNDS.every((_, i) => isDone(i))) { setTimeout(win, 500); return; }
  const t = $("toast");
  t.textContent = `Sector ${current + 1} secured · ${state[current].firstTry}/${ROUNDS[current].pairs.length} first time`;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2300);
}

function resetRound() {
  if (busy) return;
  state[current] = fresh();
  if (document.body.classList.contains("secure")) {
    document.body.classList.remove("secure");
    $("statusText").textContent = "Lockdown: media channels sealed";
  }
  showRound(current); calmEye();
}

/* Leo eye: follows the pointer and calms as pairs are verified */
const eye = document.querySelector(".eye");
function lookAt(target) {
  if (reduced()) return;
  const e = eye.getBoundingClientRect();
  let tx, ty;
  if (target.getBoundingClientRect) { const r = target.getBoundingClientRect(); tx = r.left + r.width / 2; ty = r.top + r.height / 2; }
  else { tx = target.x; ty = target.y; }
  const dx = tx - (e.left + e.width / 2), dy = ty - (e.top + e.height / 2);
  const d = Math.hypot(dx, dy) || 1, m = Math.min(6, d / 40);
  $("pupil").style.transform = `translate(${(dx / d * m).toFixed(1)}px, ${(dy / d * m).toFixed(1)}px)`;
}
document.addEventListener("pointermove", e => lookAt({ x: e.clientX, y: e.clientY }));
function calmEye() {
  if (document.body.classList.contains("secure")) return;
  const got = state.reduce((n, s) => n + s.matched.length, 0) / TOTAL;
  // alert red → amber as the threat lowers
  document.body.style.setProperty("--state", `color-mix(in srgb, #fbbf24 ${Math.round(got * 85)}%, #f43f5e)`);
}

function win() {
  const first = state.reduce((n, s) => n + s.firstTry, 0);
  const finish = () => {
    document.body.style.removeProperty("--state");
    document.body.classList.add("secure");
    $("statusText").textContent = "Media channels verified";
    log("Lockdown lifted for media channels.", "good");
    openWin(first);
  };
  if (reduced()) { finish(); return; }
  const sw = $("sweep"); sw.classList.remove("go"); void sw.offsetWidth; sw.classList.add("go");
  setTimeout(finish, 700);
}

function openWin(first) {
  $("scoreNote").textContent = `${first} of ${TOTAL} matched on the first try`;
  const lines = $("winLines"); lines.innerHTML = "";
  const row = $("codeRow"), digit = $("codeDigit");
  row.classList.remove("in"); digit.textContent = "?";
  openOverlay("winOverlay", "winOk");
  if (reduced()) {
    CONFIG.successLines.forEach(t => { const d = document.createElement("div"); d.className = "ln"; d.textContent = t; lines.appendChild(d); });
    row.classList.add("in"); digit.textContent = CONFIG.codePiece; return;
  }
  let li = 0;
  const typeLine = () => {
    if (li >= CONFIG.successLines.length) { revealCode(); return; }
    const d = document.createElement("div"); d.className = "ln"; lines.appendChild(d);
    const text = CONFIG.successLines[li++]; let c = 0;
    const iv = setInterval(() => { d.textContent = text.slice(0, ++c); if (c >= text.length) { clearInterval(iv); setTimeout(typeLine, 180); } }, 22);
  };
  const revealCode = () => {
    row.classList.add("in");
    let ticks = 0;
    const iv = setInterval(() => { digit.textContent = Math.floor(Math.random() * 10); if (++ticks > 16) { clearInterval(iv); digit.textContent = CONFIG.codePiece; } }, 60);
  };
  setTimeout(typeLine, 300);
}

let lastFocus = null;
function openOverlay(id, focusId) { lastFocus = document.activeElement; $(id).classList.add("open"); setTimeout(() => $(focusId).focus(), 60); }
function closeOverlay(id) { $(id).classList.remove("open"); if (lastFocus && lastFocus.focus) lastFocus.focus(); }

$("taskText").textContent = CONFIG.taskText;
$("taskOk").addEventListener("click", () => closeOverlay("taskOverlay"));
$("winOk").addEventListener("click", () => closeOverlay("winOverlay"));
$("resetBtn").addEventListener("click", resetRound);
$("nextBtn").addEventListener("click", () => { const i = ROUNDS.findIndex((_, k) => !isDone(k)); if (i !== -1) showRound(i); });
document.addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  ["taskOverlay", "winOverlay"].forEach(id => { if ($(id).classList.contains("open")) closeOverlay(id); });
});

buildTabs();
showRound(0);
setTimeout(() => $("taskOk").focus(), 100);
</script>
</body>
